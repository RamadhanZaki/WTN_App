org.gradle.jvmargs=-Xmx1536M -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
# DIKEMBALIKAN ke false. Sebelumnya sempat dicoba true supaya override
# compileSdk lewat com.android.build.api.dsl.* (di android/build.gradle.kts)
# lebih "resmi", tapi ternyata newDsl=true membuat Flutter Gradle Plugin
# sendiri GAGAL di-apply (error: "class ...AgpDecorated_Decorated cannot
# be cast to class ...AbstractAppExtension"), karena per Agustus 2026
# Flutter belum selesai migrasi internalnya ke AGP newDsl (masih tracked
# di flutter/flutter issue #180137). Ini opt-out resmi yang memang
# disediakan Google untuk kasus "diblokir oleh plugin pihak ketiga yang
# belum kompatibel" (lihat catatan rilis AGP 9.0). Override compileSdk=36
# di android/build.gradle.kts TETAP jalan normal walau newDsl=false,
# karena sudah pakai interface DSL baru (LibraryExtension/
# ApplicationExtension) yang didukung di kedua mode. Kalau nanti Flutter
# sudah rilis versi yang kompatibel dengan newDsl=true, boleh dicoba lagi.
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
kotlin.daemon.jvmargs=-Xmx1536M
android.builder.sdkDownload=false
# Kotlin incremental compilation punya bug lama yang crash kalau path
# project mengandung SPASI (contoh: "D:\WTN APK\wtn_blasting_app") saat
# meng-compile plugin yang punya kode native Kotlin (mis. share_plus).
# Ini mematikan incremental compilation supaya build tidak crash —
# konsekuensinya cuma build sedikit lebih lambat, TIDAK memengaruhi
# fungsi aplikasi sama sekali.
kotlin.incremental=false